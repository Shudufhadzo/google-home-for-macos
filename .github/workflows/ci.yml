name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test audio and protocol behavior
        run: swift test --disable-sandbox
      - name: Build universal native app
        run: UNIVERSAL=1 ./Scripts/build-app.sh
      - name: Verify both architectures
        run: lipo dist/HomeSpeaker.app/Contents/MacOS/HomeSpeaker -verify_arch arm64 x86_64
